<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADSY Technology - AI Assistant</title>
    <meta name="description" content="Official AI Assistant interface for ADSY Technology.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- ADSY Custom Styles -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="adsy-app-container">
        
        <!-- INITIAL WELCOME SCREEN (Reference Design) -->
        <section id="welcomeScreen" class="adsy-welcome-screen">
            <!-- ADSY Logo -->
            <div class="adsy-logo-wrapper">
                <img src="assets/adsy-logo.png" alt="ADSY Technology" class="adsy-hero-logo">
            </div>

            <!-- Welcome Heading -->
            <h1 class="adsy-welcome-heading">Welcome to ADSY TECHNOLOGY</h1>

            <!-- Hero Horizontal Input Container -->
            <form id="heroChatForm" class="adsy-input-wrapper">
                <div class="adsy-input-container">
                    <input 
                        type="text" 
                        id="heroInput" 
                        class="adsy-chat-input" 
                        placeholder="Ask anything" 
                        autocomplete="off" 
                        required
                    >
                    <button type="submit" class="adsy-send-btn" aria-label="Send arrow">
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </form>
        </section>

        <!-- ACTIVE CHAT INTERFACE SCREEN -->
        <section id="chatInterface" class="adsy-chat-interface hidden">
            <!-- Header -->
            <header class="adsy-chat-header">
                <!-- Left: Brand -->
                <div class="adsy-header-brand">
                    <img src="assets/adsy-logo.png" alt="ADSY Logo" class="adsy-header-logo">
                    <span class="adsy-brand-text">ADSY TECHNOLOGY</span>
                </div>

                <!-- Center: Secondary Tag -->
                <div class="adsy-header-center">
                    <div class="adsy-badge-ai">
                        <span class="adsy-badge-dot"></span>
                        AI Assistant
                    </div>
                </div>

                <!-- Right: Action Buttons -->
                <div class="adsy-header-actions">
                    <button type="button" id="btnNewChat" class="adsy-btn-secondary" title="Start New Chat">
                        <i class="fa-solid fa-plus"></i>
                        <span>New Chat</span>
                    </button>
                    <button type="button" id="btnClearChat" class="adsy-btn-ghost" title="Clear Chat UI">
                        <i class="fa-regular fa-trash-can"></i>
                        <span>Clear Chat</span>
                    </button>
                </div>
            </header>

            <!-- Scrollable Messages Feed -->
            <main id="chatFeed" class="adsy-chat-feed">
                <!-- Empty state shown before messages arrive -->
                <div id="emptyChatState" class="adsy-empty-chat-state">
                    <div class="adsy-empty-icon">
                        <i class="fa-solid fa-comments"></i>
                    </div>
                    <p>Start a conversation by typing your prompt below.</p>
                </div>
            </main>

            <!-- Fixed Bottom Input Dock -->
            <div class="adsy-bottom-dock">
                <form id="dockChatForm" class="adsy-input-wrapper">
                    <div class="adsy-input-container">
                        <input 
                            type="text" 
                            id="dockInput" 
                            class="adsy-chat-input" 
                            placeholder="Ask anything" 
                            autocomplete="off" 
                            required
                        >
                        <button type="submit" class="adsy-send-btn" aria-label="Send arrow">
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    </div>
                </form>
            </div>
        </section>

    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ADSY Custom Script -->
     <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
     <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
     <script src="js/script.js"></script>
    
</body>
</html>
